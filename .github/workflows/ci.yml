name: CI

# Runs every gate listed in ENGINEERING_SPEC.md section 7, plus the storage-layout
# privacy check. Anything that could pass locally and fail here - formatting,
# line endings, an unwritten parity vector - is what this job exists to catch.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A stale PR run tells you nothing; cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    name: contracts (forge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Submodules carry forge-std and OpenZeppelin; `lib/` is gitignored.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.4

      # Needed by the contract-size step below.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.foundry
            out
            cache
          key: forge-${{ hashFiles('foundry.toml') }}-${{ github.sha }}
          restore-keys: forge-${{ hashFiles('foundry.toml') }}-

      - name: forge fmt --check
        run: forge fmt --check

      - name: forge build
        run: forge build --sizes

      - name: forge lint
        run: forge lint

      - name: forge test
        run: forge test -vvv

      # Spec-mandated as a separate command so invariant failures are
      # distinguishable from unit failures in the job log.
      - name: forge test (invariants)
        run: forge test --match-path 'contracts/test/invariant/*' -vvv

      # Deeper runs for the invariant suite only: these are the properties that
      # must hold unconditionally, and 256x128 finds far more than 64x32.
      - name: forge test (invariants, deep)
        run: FOUNDRY_PROFILE=ci forge test --match-path 'contracts/test/invariant/*' -vvv

      # Contract size budget. A contract that no longer fits becomes silently
      # undeployable, which is much worse to discover at release time.
      - name: Contract sizes within limit
        run: node scripts/check-contract-sizes.mjs

  privacy:
    name: privacy (storage layout)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Compiled storage layout must declare no dynamic members on the
      # PII-sensitive contracts. Catches a `string` field added but never written,
      # which a runtime scan cannot see.
      - name: No dynamic storage in credential contracts
        run: node scripts/check-no-dynamic-storage.mjs

      # The parity vectors must match what the contract produces *now*. A stale
      # committed vector would make the parity test meaningless.
      - name: CCID vectors are up to date
        run: |
          node scripts/generate-ccid-vectors.mjs
          if ! git diff --quiet -- workflows/test/vectors/ccid-vectors.json; then
            echo "::error::CCID parity vectors are stale. Run: node scripts/generate-ccid-vectors.mjs"
            git diff -- workflows/test/vectors/ccid-vectors.json
            exit 1
          fi

  typescript:
    name: typescript (sdk + workflows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        # No `version:` key: `packageManager` in the root package.json is the
        # single source of truth. Specifying both makes the action error out.

      # The lockfile is generated on a different platform than CI runs on, so a
      # plain install rather than --frozen-lockfile. Freshness is asserted in the
      # hygiene job below instead of failing cryptically here.
      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: SDK tests
        run: pnpm --dir packages/sdk test

      - name: Workflow tests
        run: pnpm --dir workflows test

  hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Line endings are normalized by .gitattributes. A CRLF checkout breaks
      # `forge fmt --check` on files nobody touched, so verify rather than assume.
      - name: No CRLF line endings
        run: |
          if git grep -Il $'\r' -- . ':!pnpm-lock.yaml'; then
            echo "::error::CRLF line endings found; run: git add --renormalize ."
            exit 1
          fi

      - name: No committed secrets or identity data
        run: |
          # Fails on the filenames that must never exist in the repository.
          if git ls-files | grep -Ei '\.(env|keystore|pem|key|p12|pfx)$|(^|/)(secrets?|credentials?)\.(json|yaml|yml|toml)$'; then
            echo "::error::a secret-like file is tracked"
            exit 1
          fi
          # Fails on identity-bearing *Solidity storage declarations* in production
          # source. Scoped to `contracts/src/**` deliberately:
          #   - `contracts/test/**` names these fields in comments documenting the
          #     mutation cases the privacy tests depend on.
          #   - `workflows/src/privacy.ts` names them in a *blocklist* - naming a
          #     field is exactly what forbidding it requires.
          # Both are legitimate, and a check that flags them creates pressure to
          # weaken the protections they exist to verify.
          #
          # This is a backstop behind `check-no-dynamic-storage.mjs`, not a
          # replacement: that script walks the compiled layout and is authoritative.
          if git grep -InE '\b(legalName|fullName|dateOfBirth|passportNumber|taxId|ssn)\b' -- 'contracts/src/**'; then
            echo "::error::an identity-bearing field name appears in contract source"
            exit 1
          fi

      - name: Docs contain no unverified claims
        run: |
          # The repository has no audit and no deployment. Documentation that
          # implies otherwise is the fastest way to mislead a reader, and the
          # fastest way to lose a user's trust.
          #
          # The lookbehind excludes negated claims, because stating "it is not
          # audited" is exactly what SECURITY.md must do. A check that fires on
          # the disclaimer would pressure someone into deleting the disclaimer.
          if git grep -InP '(?<!not )(?<!no )\b(audited|security audit (is )?complete|production[- ]ready|mainnet (is )?live)\b' -- '*.md'; then
            echo "::error::documentation claims an audit or production deployment that does not exist"
            exit 1
          fi